<!-- Booking Modal -->
<div id="booking-modal" class="modal">
  <div class="modal-content glass">
    <span class="close-btn" onclick="closeModal('booking-modal')">&times;</span>
    <h2 id="modal-trip-title">Complete Reservation</h2>
    <form id="booking-form" onsubmit="submitBooking(event)">
      <input type="hidden" id="trip-title-input">
      
      <div class="form-group">
        <label for="passenger-name">Full Name</label>
        <input type="text" id="passenger-name" placeholder="John Doe" required style="width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff;">
      </div>

      <div class="form-group" style="margin-top: 15px;">
        <label for="passenger-phone">Phone Number / WhatsApp</label>
        <input type="tel" id="passenger-phone" placeholder="+20 100 000 0000" required style="width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff;">
      </div>

      <div class="form-group" style="margin-top: 15px;">
        <label for="guests">Number of Passengers</label>
        <input type="number" id="guests" min="1" value="1" required style="width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff;">
      </div>

      <div class="form-group" style="margin-top: 15px;">
        <label for="notes">Special Requests / Notes</label>
        <textarea id="notes" rows="3" placeholder="Flight number, pickup time..." style="width: 100%; padding: 12px; margin-top: 6px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.3); color: #fff;"></textarea>
      </div>

      <button type="submit" class="submit-btn" style="width: 100%; padding: 14px; margin-top: 20px; border-radius: 8px; border: none; background: #0284c7; color: #fff; font-weight: bold; cursor: pointer;">Confirm Booking</button>
    </form>
  </div>
</div>
