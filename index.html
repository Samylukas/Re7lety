<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Re7lety - Transport Fleet & Excursion Platform</title>
  <link rel="stylesheet" href="style.css?v=4.0">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="navbar">
    <div class="logo">
      <i class="fa-solid fa-route"></i> Re7lety
    </div>
    <div class="nav-links">
      <button class="login-btn" id="loginNavBtn" onclick="openLoginModal()">
        <i class="fa-solid fa-user-lock"></i> Staff Login
      </button>
      <button class="logout-btn" id="logoutNavBtn" onclick="logout()" style="display:none;">
        <i class="fa-solid fa-right-from-bracket"></i> Logout
      </button>
    </div>
  </nav>

  <!-- Hero Header Banner -->
  <header class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <span class="badge"><i class="fa-solid fa-plane-arrival"></i> Smart Mobility Hub</span>
      <h1>Marsa Alam & El Quseir</h1>
      <p>Scheduled Airport Transfers, Fleet Services & Private Excursions</p>
    </div>
  </header>

  <!-- Service Filter Buttons -->
  <section class="container">
    <div class="filters">
      <button class="filter-btn active" onclick="filterTrips('all')"><i class="fa-solid fa-globe"></i> All Services</button>
      <button class="filter-btn" onclick="filterTrips('airport')"><i class="fa-solid fa-taxi"></i> Airport Shuttles</button>
      <button class="filter-btn" onclick="filterTrips('hotel')"><i class="fa-solid fa-hotel"></i> Hotel Transfers</button>
      <button class="filter-btn" onclick="filterTrips('marine')"><i class="fa-solid fa-ship"></i> Marine Trips</button>
      <button class="filter-btn" onclick="filterTrips('safari')"><i class="fa-solid fa-compass"></i> Safari & Tours</button>
    </div>

    <!-- Cards Grid Container -->
    <div id="trips-container" class="trips-grid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>

    <!-- Admin & Company Fleet Dashboard -->
    <div id="dashboard" class="dashboard" style="display:none;">
      <div class="dash-header">
        <h2 id="welcomeUser"><i class="fa-solid fa-chart-line"></i> Operations Dashboard</h2>
        <button class="action-btn print-btn" id="exportBtn" onclick="window.print()">
          <i class="fa-solid fa-print"></i> Export Report
        </button>
      </div>

      <!-- Quick KPI Stats (SuperAdmin / CompanyAdmin) -->
      <div id="adminSummary" class="stats-cards" style="display:none;">
        <div class="card">
          <i class="fa-solid fa-bookmark card-icon"></i>
          <div>
            <h3 id="totalBookings">0</h3>
            <p>Total Reservations</p>
          </div>
        </div>
        <div class="card">
          <i class="fa-solid fa-users card-icon"></i>
          <div>
            <h3 id="totalGuests">0</h3>
            <p>Reserved Seats</p>
          </div>
        </div>
      </div>

      <!-- Bookings & Fleet Operations Table -->
      <div class="table-wrapper">
        <table id="bookingsTable">
          <thead>
            <tr>
              <th>Booked Date</th>
              <th>Passenger Ref</th>
              <th>Phone</th>
              <th>Trip ID</th>
              <th>Travel Date</th>
              <th>Seats</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="bookingsTableBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Guest Reservation Modal -->
  <div id="booking-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('booking-modal')">&times;</span>
      <h2 id="modal-trip-title"><i class="fa-solid fa-calendar-plus"></i> Reserve Seats</h2>
      <form id="booking-form" onsubmit="submitBooking(event)">
        <input type="hidden" id="trip-title-input">
        <div class="form-group">
          <label>Passenger Full Name</label>
          <input type="text" id="name" required placeholder="e.g. John Doe">
        </div>
        <div class="form-group">
          <label>WhatsApp / Phone Number</label>
          <input type="tel" id="phone" required placeholder="+20 10x xxx xxxx">
        </div>
        <div class="form-group">
          <label>Seats Required</label>
          <input type="number" id="guests" min="1" value="1" required>
        </div>
        <div class="form-group">
          <label>Hotel Name / Flight Number & Notes</label>
          <textarea id="notes" rows="3" placeholder="Specify pickup hotel or arrival flight details"></textarea>
        </div>
        <button type="submit" id="submit-btn" class="submit-btn">Confirm Reservation</button>
      </form>
    </div>
  </div>

  <!-- Staff Portal Login Modal -->
  <div id="login-modal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('login-modal')">&times;</span>
      <h2><i class="fa-solid fa-shield-halved"></i> Re7lety Staff Portal</h2>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Username / Email</label>
          <input type="text" id="loginUsername" required placeholder="admin / coord">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" required>
        </div>
        <button type="submit" class="submit-btn">Sign In</button>
      </form>
    </div>
  </div>

  <script src="main.js?v=4.0"></script>
</body>
</html>
